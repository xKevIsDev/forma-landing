# Generated by Clype. On every pull request it replays the project's recorded sessions against the
# merge-base and against this branch. Clype then posts the "Clype visual review" commit status and a
# summary comment through its GitHub App; this job's own check only says whether the replay ran.
# No secrets needed: the job signs in to Clype with its GitHub OIDC token (id-token: write).
# Edit the install, build and serve lines below to match your app; it must answer on http://localhost:5173.
name: Clype

on:
  pull_request:
    types: [opened, synchronize, reopened]

# GITHUB_TOKEN only reports "No sessions to compare" and comments when the GitHub App can't
permissions:
  contents: read
  id-token: write
  pull-requests: write
  statuses: write

concurrency:
  group: clype-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  replay:
    name: Replay sessions
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLYPE_API: "https://clype.kevin-c3a.workers.dev/api"
      CLYPE_PROJECT: "29e05759-0df9-4ab7-b4ae-0c69ef73437d"
      CLYPE_TARGET_ORIGIN: http://localhost:5173
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_REF: origin/${{ github.event.pull_request.base.ref }}
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the Clype CLI
        run: npm install -g "$CLYPE_API/cli.tgz"
      - name: Replay the merge-base
        run: |
          git worktree add --detach .clype-base "$(git merge-base "$HEAD_SHA" "$BASE_REF")"
          cd .clype-base
          wait_for_app() {
            for _ in $(seq 60); do curl -fs "$CLYPE_TARGET_ORIGIN" > /dev/null && return 0; sleep 1; done
            echo "The app did not answer on $CLYPE_TARGET_ORIGIN within 60s:"; tail -n 50 "$RUNNER_TEMP/base.log"; return 1
          }
          npm install --no-audit --no-fund
          npm run build
          setsid npx vite preview --port 5173 --strictPort > "$RUNNER_TEMP/base.log" 2>&1 &
          APP_PID=$!
          wait_for_app
          clype ci pr --phase base --commit "$HEAD_SHA" --base-ref "$BASE_REF" --no-comment
          kill -- "-$APP_PID" || true
          for _ in $(seq 30); do curl -fs "$CLYPE_TARGET_ORIGIN" > /dev/null || break; sleep 1; done
      - name: Replay this pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          wait_for_app() {
            for _ in $(seq 60); do curl -fs "$CLYPE_TARGET_ORIGIN" > /dev/null && return 0; sleep 1; done
            echo "The app did not answer on $CLYPE_TARGET_ORIGIN within 60s:"; tail -n 50 "$RUNNER_TEMP/head.log"; return 1
          }
          npm install --no-audit --no-fund
          npm run build
          setsid npx vite preview --port 5173 --strictPort > "$RUNNER_TEMP/head.log" 2>&1 &
          APP_PID=$!
          wait_for_app
          clype ci pr --phase head --commit "$HEAD_SHA" --base-ref "$BASE_REF"
